<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StarTier</title>
<style>
html,body{height:100%;margin:0;background:#0B0B0B;color:#f3ead7;font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.star{width:96px;height:96px;margin-bottom:22px}
h1{color:#d9b45a;font-size:24px;margin:0 0 8px}
p{margin:0 0 24px;color:#cfc4ad;max-width:320px}
button{border:0;border-radius:999px;padding:14px 28px;background:#d9b45a;color:#0B0B0B;font-weight:700;font-size:16px}
</style></head>
<body><main>
<svg class="star" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,5 61,38 96,38 68,58 79,92 50,71 21,92 32,58 4,38 39,38" fill="#d9b45a"/></svg>
<h1>You're offline</h1>
<p>StarTier needs the internet to play music and videos. Check your Wi-Fi or data, then try again.</p>
<button onclick="location.href='https://startier.app/'">Try again</button>
</main></body></html>

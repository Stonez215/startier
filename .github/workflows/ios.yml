# Builds the StarTier iPhone app on GitHub's Macs (no Mac needed).
# - Every push that changes mobile/: a test build to make sure it compiles.
# - "Run workflow" on the Actions tab (with the secrets set): signs it and sends it to TestFlight / App Store Connect.
# Secrets (GitHub > Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the whole text of the AuthKey_XXXX.p8 file)
name: iPhone app
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', '.github/workflows/ios.yml']
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios
      - name: Test build (no signing)
        if: github.event_name != 'workflow_dispatch'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Build, sign and upload to App Store Connect
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then echo "Add the App Store Connect secrets first."; exit 1; fi
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8; printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          # Built unsigned on purpose; the export step signs it for the App Store (no test devices needed).
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/StarTier.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive | tail -40
          test -d "$RUNNER_TEMP/StarTier.xcarchive"
          # Put the app's permissions (Sign in with Apple) on the unsigned build so the App Store signing keeps them.
          APP=$(ls -d "$RUNNER_TEMP"/StarTier.xcarchive/Products/Applications/*.app)
          for f in "$APP"/Frameworks/*; do [ -e "$f" ] && codesign --force --sign - "$f"; done
          codesign --force --sign - --entitlements ios/App/App/App.entitlements "$APP"
          codesign -d --entitlements - "$APP" | grep -A1 applesignin
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/StarTier.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out" $AUTH
          IPA=$(ls "$RUNNER_TEMP"/out/*.ipa | head -1)
          (cd "$RUNNER_TEMP" && rm -rf chk && mkdir chk && cd chk && unzip -q "$IPA" && codesign -d --entitlements - --xml Payload/*.app > ent.plist 2>/dev/null; cat ent.plist)
          if ! grep -q applesignin "$RUNNER_TEMP/chk/ent.plist"; then echo "Stopped: Sign in with Apple permission is missing from the signed app, so it was not uploaded."; exit 1; fi
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} to App Store Connect. It shows in TestFlight after Apple processes it."

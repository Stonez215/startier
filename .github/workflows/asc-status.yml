# Shows the App Store status of StarTier, Slide Thru and BookedUp, and adds the account holder to TestFlight on each.
name: App Store status
on: workflow_dispatch
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "pyjwt[crypto]" requests
      - run: python .github/scripts/asc_status.py

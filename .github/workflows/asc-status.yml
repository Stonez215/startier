# Shows the App Store status of StarTier, Slide Thru and BookedUp, and adds the account holder to TestFlight on each.
name: App Store status
on:
  workflow_dispatch:
    inputs:
      script:
        description: Which script to run
        default: asc_status.py
      submit:
        description: Bundle ids to submit (comma list)
        default: ''
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      SUBMIT: ${{ inputs.submit }}
      SHOT_SETS: ${{ inputs.submit == 'ipad-shots' && 'store/screenshots-ipad:APP_IPAD_PRO_3GEN_129' || '' }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "pyjwt[crypto]" requests
      - run: python .github/scripts/${{ inputs.script || 'asc_status.py' }}
